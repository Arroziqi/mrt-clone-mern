version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mrt_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  api:
    build: .
    container_name: mrt_api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/mrt_jakarta
      - NODE_ENV=development
      # Use an environment variable file if you have secrets, or define them here.
      - JWT_SECRET=supersecretmrttoken
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb_data:
